[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kala"
version = "0.1.0"
description = "Kala vulnerability discovery toolkit - fuzzing triage pipeline"
requires-python = ">=3.11"

[project.scripts]
kala = "triage.cli:main"

[tool.setuptools]
packages = ["triage", "orchestrate"]
